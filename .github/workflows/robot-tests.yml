name: Première robot tests

on:
  push:
    branches: [main]
    paths:
      - "premiere/robot/**"
      - "premiere/supabase/schema.sql"
      - ".github/workflows/robot-tests.yml"
  pull_request:
    paths:
      - "premiere/robot/**"
      - "premiere/supabase/schema.sql"
      - ".github/workflows/robot-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: premiere/robot/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r premiere/robot/requirements.txt
      - name: Compile Python
        working-directory: premiere/robot
        run: python -m compileall -q .
      - name: Unit tests
        working-directory: premiere/robot
        run: python -m unittest discover -s tests -v
      - name: Validate installer syntax
        run: bash -n premiere/robot/installer.sh
